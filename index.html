<!DOCTYPE html>
<html lang="zh-CN" data-locale="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.title">Scratch Pad</title>
    <meta name="description" data-i18n-content="meta.description" content="" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
    <!--
      主题预置：必须在首帧绘制前执行，否则会看到系统主题闪一下再切到用户选择。
      这里刻意用内联脚本而非外部文件，避免多一次网络往返。
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("scratch-pad-site:theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.dataset.theme = saved;
          }
        } catch (e) {
          /* 隐私模式下 localStorage 不可用，退回跟随系统 */
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">
      <span data-i18n="nav.features">特性</span>
    </a>

    <!-- ============ 顶栏 ============ -->
    <header class="site-header" id="siteHeader">
      <div class="shell header-inner">
        <a class="brand" href="#top">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="3" width="16" height="18" rx="2" />
              <path d="M8 8h8" />
              <path d="M8 12h5" />
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-name" data-i18n="brand.name">Scratch Pad</span>
            <span class="brand-tagline" data-i18n="brand.tagline">桌面速记编辑器</span>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <a href="#philosophy" data-i18n="philosophy.kicker">核心理念</a>
          <a href="#features" data-i18n="nav.features">特性</a>
          <a href="#commands" data-i18n="nav.commands">命令</a>
          <a href="#shortcuts" data-i18n="nav.shortcuts">快捷键</a>
          <a href="#format" data-i18n="nav.format">文件格式</a>
          <a href="#roadmap" data-i18n="nav.roadmap">路线图</a>
        </nav>

        <div class="header-actions">
          <button
            type="button"
            class="theme-toggle"
            id="themeToggle"
            aria-live="polite"
            data-i18n-aria-label="theme.toggle"
            data-i18n-title="theme.toggle"
          >
            <!-- 三个图标同时存在，由 CSS 按 html[data-theme] 决定显隐 -->
            <svg class="ti ti-system" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="13" rx="2" />
              <path d="M9 21h6" /><path d="M12 17v4" />
            </svg>
            <svg class="ti ti-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" /><path d="M12 20v2" /><path d="M4.9 4.9l1.4 1.4" />
              <path d="M17.7 17.7l1.4 1.4" /><path d="M2 12h2" /><path d="M20 12h2" />
              <path d="M4.9 19.1l1.4-1.4" /><path d="M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="ti ti-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
          <div class="lang-switch" role="group" data-i18n-aria-label="lang.switch">
            <button type="button" class="lang-btn" data-lang-btn="zh">中文</button>
            <button type="button" class="lang-btn" data-lang-btn="en">EN</button>
            <span class="lang-thumb" aria-hidden="true"></span>
          </div>
          <a class="btn btn-primary btn-sm" href="#download">
            <span data-i18n="nav.download">下载</span>
          </a>
        </div>
      </div>
    </header>

    <main id="main">
      <!-- ============ Hero ============ -->
      <section class="hero" id="top">
        <div class="shell hero-grid">
          <div class="hero-copy">
            <p class="badge rise" style="--d: 0ms">
              <span class="badge-dot" aria-hidden="true"></span>
              <span data-i18n="hero.badge">Tauri 2 · Vue 3 · Tiptap 3</span>
            </p>
            <h1 class="hero-title rise" style="--d: 60ms">
              <span data-i18n="hero.title1">打开即写，</span><br />
              <span class="accent" data-i18n="hero.title2">写完即走。</span>
            </h1>
            <p class="hero-lead rise" style="--d: 120ms" data-i18n="hero.lead"></p>
            <div class="hero-cta rise" style="--d: 180ms">
              <div class="btn-split" data-download-split>
                <a class="btn btn-primary" href="https://github.com/cz2415/scratch-pad-app/releases/latest/download/Scratch-Pad-x64-portable.exe">
                  <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3v12" /><path d="m7 11 5 5 5-5" /><path d="M4 20h16" />
                  </svg>
                  <span data-i18n="hero.ctaPrimary">下载便携版</span>
                </a>
                <button class="btn-split-arrow" type="button" aria-haspopup="true" aria-expanded="false"
                  data-i18n-aria-label="hero.ctaMore" data-i18n-title="hero.ctaMore">
                  <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </button>
                <div class="btn-split-menu" hidden>
                  <a href="https://github.com/cz2415/scratch-pad-app/releases/latest/download/Scratch-Pad-x64-setup.exe">
                    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                      stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M12 3v12" /><path d="m7 11 5 5 5-5" /><path d="M4 20h16" />
                    </svg>
                    <span data-i18n="hero.ctaInstaller">下载安装版</span>
                  </a>
                </div>
              </div>
              <a class="btn btn-ghost" href="#features">
                <span data-i18n="hero.ctaSecondary">查看特性</span>
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14" /><path d="m13 6 6 6-6 6" />
                </svg>
              </a>
            </div>
            <p class="hero-note rise" style="--d: 240ms" data-i18n="hero.note"></p>

            <dl class="hero-stats rise" style="--d: 300ms">
              <div class="stat">
                <dt class="stat-value" data-i18n="hero.stat1.value">0</dt>
                <dd class="stat-label" data-i18n="hero.stat1.label"></dd>
              </div>
              <div class="stat">
                <dt class="stat-value" data-i18n="hero.stat2.value">0</dt>
                <dd class="stat-label" data-i18n="hero.stat2.label"></dd>
              </div>
              <div class="stat">
                <dt class="stat-value" data-i18n="hero.stat3.value">8</dt>
                <dd class="stat-label" data-i18n="hero.stat3.label"></dd>
              </div>
            </dl>
          </div>

          <!-- 应用窗口实拍（截图为真实运行界面） -->
          <figure class="hero-shot rise" style="--d: 200ms">
            <div class="window" role="img" data-i18n-aria-label="alt.appWindow">
              <div class="window-bar">
                <div class="window-tabs">
                  <span class="wtab is-active">
                    <span class="wtab-name">weekly-notes</span>
                  </span>
                  <span class="wtab">
                    <span class="wtab-dot" aria-hidden="true"></span>
                    <span class="wtab-name">scratch</span>
                  </span>
                </div>
                <div class="window-controls" aria-hidden="true">
                  <span class="wc"></span><span class="wc"></span><span class="wc wc-close"></span>
                </div>
              </div>
              <div class="window-body">
                <!-- 按系统主题切换亮/暗两版截图，与官网主题保持一致观感 -->
                <picture>
                  <source
                    srcset="assets/screenshots/editor-dark.png"
                    media="(prefers-color-scheme: dark)"
                  />
                  <img
                    src="assets/screenshots/editor-light.png"
                    alt=""
                    loading="eager"
                    onerror="this.closest('.window-body').classList.add('is-missing')"
                  />
                </picture>
                <div class="shot-fallback" aria-hidden="true">
                  <div class="fb-line fb-h1"></div>
                  <div class="fb-line fb-p"></div>
                  <div class="fb-line fb-p fb-short"></div>
                  <div class="fb-callout"></div>
                  <div class="fb-line fb-p"></div>
                  <div class="fb-code"></div>
                </div>
              </div>
            </div>
            <figcaption class="shot-caption" data-i18n="hero.shotCaption"></figcaption>
          </figure>
        </div>
      </section>

      <!-- ============ 核心理念 ============ -->
      <section class="section" id="philosophy">
        <div class="shell">
          <div class="section-head">
            <p class="kicker" data-i18n="philosophy.kicker">核心理念</p>
            <h2 class="section-title" data-i18n="philosophy.title">Open. Edit. Leave.</h2>
            <p class="section-lead" data-i18n="philosophy.lead"></p>
          </div>

          <div class="triple">
            <article class="pillar">
              <span class="pillar-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 6h16" /><path d="M4 12h16" /><path d="M4 18h10" />
                </svg>
              </span>
              <h3 data-i18n="philosophy.p1.title"></h3>
              <p data-i18n="philosophy.p1.desc"></p>
            </article>
            <article class="pillar">
              <span class="pillar-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                  <path d="M14 3v5h5" />
                </svg>
              </span>
              <h3 data-i18n="philosophy.p2.title"></h3>
              <p data-i18n="philosophy.p2.desc"></p>
            </article>
            <article class="pillar">
              <span class="pillar-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="6" width="18" height="12" rx="2" />
                  <path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8" />
                </svg>
              </span>
              <h3 data-i18n="philosophy.p3.title"></h3>
              <p data-i18n="philosophy.p3.desc"></p>
            </article>
          </div>
        </div>
      </section>

      <!-- ============ 特性 ============ -->
      <section class="section section-alt" id="features">
        <div class="shell">
          <div class="section-head">
            <p class="kicker" data-i18n="features.kicker">特性</p>
            <h2 class="section-title" data-i18n="features.title"></h2>
            <p class="section-lead" data-i18n="features.lead"></p>
          </div>

          <div class="feature-grid" id="featureGrid">
            <!-- 由 app.js 按 i18n 词条渲染，保证中英结构一致 -->
          </div>
        </div>
      </section>

      <!-- ============ 斜杠命令 ============ -->
      <section class="section" id="commands">
        <div class="shell">
          <div class="section-head">
            <p class="kicker" data-i18n="commands.kicker"></p>
            <h2 class="section-title" data-i18n="commands.title"></h2>
            <p class="section-lead" data-i18n="commands.lead"></p>
          </div>

          <div class="command-groups" id="commandGroups"></div>
          <p class="command-hint" data-i18n="commands.hint"></p>
        </div>
      </section>

      <!-- ============ 快捷键 ============ -->
      <section class="section section-alt" id="shortcuts">
        <div class="shell">
          <div class="section-head">
            <p class="kicker" data-i18n="shortcuts.kicker"></p>
            <h2 class="section-title" data-i18n="shortcuts.title"></h2>
            <p class="section-lead" data-i18n="shortcuts.lead"></p>
          </div>
          <div class="shortcut-columns" id="shortcutColumns"></div>
        </div>
      </section>

      <!-- ============ 文件格式 ============ -->
      <section class="section" id="format">
        <div class="shell">
          <div class="section-head">
            <p class="kicker" data-i18n="format.kicker"></p>
            <h2 class="section-title" data-i18n="format.title"></h2>
            <p class="section-lead" data-i18n="format.lead"></p>
          </div>

          <!-- 容器布局示意 -->
          <div class="layout-diagram" aria-hidden="true">
            <div class="seg seg-magic">
              <span class="seg-name">SCRT</span>
              <span class="seg-size">4 B</span>
            </div>
            <div class="seg seg-num">
              <span class="seg-name">ver</span>
              <span class="seg-size">2 B</span>
            </div>
            <div class="seg seg-num">
              <span class="seg-name">flags</span>
              <span class="seg-size">2 B</span>
            </div>
            <div class="seg seg-num">
              <span class="seg-name">meta len</span>
              <span class="seg-size">8 B</span>
            </div>
            <div class="seg seg-num">
              <span class="seg-name">content len</span>
              <span class="seg-size">8 B</span>
            </div>
            <div class="seg seg-part seg-meta">
              <span class="seg-name">meta</span>
              <span class="seg-size">msgpack + zstd</span>
            </div>
            <div class="seg seg-part seg-content">
              <span class="seg-name">content</span>
              <span class="seg-size">msgpack + zstd</span>
            </div>
            <div class="seg seg-crc">
              <span class="seg-name">CRC32</span>
              <span class="seg-size">4 B</span>
            </div>
          </div>

          <div class="spec-table-wrap">
            <table class="spec-table">
              <thead>
                <tr>
                  <th data-i18n="format.col.field">分区</th>
                  <th data-i18n="format.col.size">长度</th>
                  <th data-i18n="format.col.desc">说明</th>
                </tr>
              </thead>
              <tbody id="formatRows"></tbody>
            </table>
          </div>

          <div class="guarantees" id="guarantees"></div>

          <aside class="escape-hatch">
            <div class="escape-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <path d="m10 17 5-5-5-5" /><path d="M15 12H3" />
              </svg>
            </div>
            <div class="escape-body">
              <h3 data-i18n="format.escape.title"></h3>
              <p data-i18n="format.escape.desc"></p>
              <ul class="tag-list">
                <li data-i18n="format.escape.tag1"></li>
                <li data-i18n="format.escape.tag2"></li>
                <li data-i18n="format.escape.tag3"></li>
              </ul>
            </div>
          </aside>
        </div>
      </section>

      <!-- ============ 路线图 ============ -->
      <section class="section section-alt" id="roadmap">
        <div class="shell">
          <div class="section-head">
            <p class="kicker" data-i18n="roadmap.kicker"></p>
            <h2 class="section-title" data-i18n="roadmap.title"></h2>
            <p class="section-lead" data-i18n="roadmap.lead"></p>
          </div>

          <ol class="timeline" id="timeline"></ol>

          <div class="out-of-scope">
            <h3 data-i18n="roadmap.notTitle"></h3>
            <ul class="scope-list" id="outOfScope"></ul>
          </div>
        </div>
      </section>

      <!-- ============ 下载 CTA ============ -->
      <section class="cta-section" id="download">
        <div class="shell">
          <div class="cta-card">
            <h2 data-i18n="cta.title"></h2>
            <p data-i18n="cta.desc"></p>
            <div class="cta-actions">
              <a class="btn btn-primary btn-lg" href="https://github.com/cz2415/scratch-pad-app/releases/latest/download/Scratch-Pad-x64-portable.exe">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 3v12" /><path d="m7 11 5 5 5-5" /><path d="M4 20h16" />
                </svg>
                <span data-i18n="cta.portable"></span>
              </a>
              <a class="btn btn-outline btn-lg" href="https://github.com/cz2415/scratch-pad-app/releases/latest/download/Scratch-Pad-x64-setup.exe">
                <span data-i18n="cta.installer"></span>
              </a>
              <a class="btn btn-outline btn-lg" href="#format">
                <span data-i18n="cta.secondary"></span>
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- ============ 页脚 ============ -->
    <footer class="site-footer">
      <div class="shell footer-grid">
        <div class="footer-brand">
          <span class="brand-name" data-i18n="brand.name"></span>
          <p class="footer-desc" data-i18n="footer.copyright"></p>
          <p class="footer-stack" data-i18n="footer.builtWith"></p>
        </div>
        <div class="footer-col">
          <h4 data-i18n="footer.product"></h4>
          <ul>
            <li><a href="#features" data-i18n="nav.features"></a></li>
            <li><a href="#commands" data-i18n="nav.commands"></a></li>
            <li><a href="#shortcuts" data-i18n="nav.shortcuts"></a></li>
            <li><a href="#roadmap" data-i18n="nav.roadmap"></a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4 data-i18n="footer.resources"></h4>
          <ul>
            <li><a href="#format" data-i18n="nav.format"></a></li>
            <li><a href="#download" data-i18n="nav.download"></a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4 data-i18n="footer.about"></h4>
          <dl class="footer-meta">
            <dt data-i18n="footer.license"></dt>
            <dd data-i18n="footer.licenseValue"></dd>
            <dt data-i18n="footer.format"></dt>
            <dd data-i18n="footer.formatValue"></dd>
            <dt data-i18n="footer.platform"></dt>
            <dd data-i18n="footer.platformValue"></dd>
          </dl>
        </div>
      </div>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
